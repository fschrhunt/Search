# The workspace: every crate lives under crates/, one folder per crate.
#
#   core  the search engine itself: discovery, fetch, index, and the MCP
#         surface — terminal-free and frontend-free
#   cli   the `search` binary: arguments, wiring, and the serve loop
#
# cli depends on core and never the reverse. Rust items in core are not a
# stable third-party API; the supported surface is the binary and the MCP
# tools it serves.
[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

# The application's version is the release version: the tag, `search --version`,
# the archives, the Homebrew formula, and the install channel all come from it.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
homepage = "https://github.com/fschrhunt/search"
repository = "https://github.com/fschrhunt/search"

[workspace.dependencies]
search-core = { package = "search-core", path = "crates/core", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
dom_smoothie = "0.18"
dom_query = "0.28"
rusqlite = { version = "0.40", features = ["bundled"] }
url = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
sha2 = "0.11"
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"

# Release builds trade build time for a small, fast binary. Unwinding stays ON:
# a panicking handler is caught at the task boundary and reported, rather than
# taking the process down.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
