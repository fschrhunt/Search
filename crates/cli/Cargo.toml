[package]
# The package is `cli`; it exports `search_cli` and installs the `search` binary.
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Command-line interface and HTTP server for Search"
publish = false

[lib]
name = "search_cli"
path = "src/lib.rs"

[[bin]]
name = "search"
path = "src/main.rs"

[dependencies]
search.workspace = true
search_mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal", "io-std", "net"] }
axum.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
